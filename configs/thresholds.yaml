# Pre-registered verification thresholds (§10.6) and all other decision constants.
# Freeze this file before the main run; its SHA-256 goes into the OSF pre-registration (Appendix E.3).
# Every `sensitivity` entry is re-run by analysis/robustness.py (§12.7).
version: "v2.0-prereg-draft"

nudge:                       # §10.2 nudge tests
  n_contexts: 500            # N stock-date contexts, stratified by year and size
  delta_sigma: 0.5           # +0.5 sigma of the stock's own input
  supported_lower: 0.90      # Clopper-Pearson lower bound of share in claimed direction
  refuted_upper: 0.10        # Clopper-Pearson upper bound
  confidence: 0.95
  sensitivity:
    n_contexts: [200, 1000]
    delta_sigma: [0.25, 1.0]
    bounds: [0.85, 0.95]     # applied symmetrically: supported_lower=b, refuted_upper=1-b

drivers:                     # §10.2 driver attribution (coverage metrics only)
  total_effect_threshold: 0.10
  block_length: 20
  sensitivity:
    total_effect_threshold: [0.05, 0.20]

behavioral:                  # §10.3
  ci_level: 0.95
  tost_ci_level: 0.90
  resemblance_floor: 0.30
  resemblance_refute_ceiling: 0.10
  resemblance_sign_error: -0.30
  independence_margin: 0.10
  exposure_t: 3.0
  exposure_beta_floor: 0.10
  turnover_low_percentile: 75
  turnover_high_percentile: 25
  regime_t: 2.0
  pred_sign_t: 2.0
  comparative_t: 2.0
  bootstrap:
    n_boot: 1000
    method: stationary       # Politis-Romano (1994)
    block_length: auto       # Politis-White (2004) / Patton-Politis-White (2009)
    seed: 20261006
  sensitivity:
    resemblance_floor: [0.20, 0.40]          # +/-50% band around 0.30 is reported, 0.20-0.40 range per §10.6
    resemblance_refute_ceiling: [0.05, 0.15]
    independence_margin: [0.05, 0.15]

originality:                 # §10.3 NOVEL rule
  novelty_ceiling: 0.50
  duplicate_floor: 0.80
  alpha_t: 3.0
  sensitivity:
    novelty_ceiling: [0.40, 0.60]
    duplicate_floor: [0.70, 0.90]

identity:                    # §6.5 / §10.2
  equivalence_rho: 0.999
  equivalence_date_share: 0.99
  variant_supported_rho: 0.90
  variant_refuted_rho: 0.30
  sensitivity:
    equivalence_rho: [0.995]

performance:                 # §10.4
  discovery_t: 3.0           # HLZ bar, used for verdicts
  reported_t: 2.0            # reported, never used for verdicts
  refute_t: 2.0              # "robust/significant" claim REFUTED if OOS t below the conventional bar
  stability_supported_share: 0.75
  stability_refuted_share: 0.50
  dsr_supported: 0.95
  dsr_refuted: 0.50
  pbo_partitions: 16
  min_post_cutoff_months: 6
  costs_bp:
    CN: {buy: 5, sell: 15}
    US: {buy: 0, sell: 5}
    sensitivity_per_trade: 15

metamorphic:
  exact_rel_tol: 1.0e-9      # relation "holds exactly"
  violation_rel_tol: 1.0e-3  # relative deviation counted as a violation
  violation_share: 0.01      # REFUTED if more than this share of valid cells violate

range:
  empirical_tol: 1.0e-9

horizon_bins:                # §9.5 / §10.6 / Appendix C (trading days, inclusive upper bounds)
  very_short: 5
  short: 21
  medium: 126                # 22-126
  # long: > 126

executors:                   # §6.4
  abs_tol: 1.0e-8
  rank_corr_fallback: 0.9999
  n_random_formulas: 500

causality:                   # §6.3 layer 3
  n_truncations: 5

pools:                       # §7.1 / §7.2
  validity_xs_std_share: 0.95
  validity_coverage: 0.80
  novel_max_abs_rho: 0.70

parser_go_no_go:             # §9.3
  f1_c1_c6: 0.80
  f1_c2_c3: 0.70
  alpha_tentative: 0.667
  alpha_reliable: 0.80

calibration:                 # §10.7
  static_accuracy: 0.99
  statistical_accuracy: 0.95
  max_sign_errors: 0

multiplicity:                # §12.5
  confirmatory_fwer: 0.05
  exploratory_fdr: 0.10

judges:
  b1_accept_threshold: 0.8   # c2 >= 0.8 counts as "accepted" for false-accept rate (§11)
  b4_alphalogics_agreement: 0.90
  cf5_auroc_bound: 0.90
