    roles: [author, narrator, cross_narrator]
    provider: local
    base_url: http://localhost:8003/v1
    api_key_env: null
    model_string: TO_PIN_ON_RUN_DATE
    weights_sha256: TO_FILL
    quantization: TO_FILL
    engine: TO_FILL
    engine_version: TO_FILL
    training_cutoff: TO_FILL
    cutoff_probe: null
    may_train_on_inputs: false
    pinned: false
  # ---------------- closed-weight via free tiers (verify availability and data-use terms) ----------
  - id: closed-c-flash
    family: closed_family_c
    organization: org_c
    open_weight: false
    size_b: null
    reasoning: false
    tool_use: true
    roles: [author, narrator]
    provider: openai_compatible
    base_url: TO_FILL                            # provider's OpenAI-compatible endpoint
    api_key_env: CLOSED_C_API_KEY
    model_string: TO_PIN_ON_RUN_DATE
    training_cutoff: TO_FILL
    cutoff_probe: null
    may_train_on_inputs: TO_FILL                 # if true -> never send the Novel pool (§7.2)
    pinned: false
